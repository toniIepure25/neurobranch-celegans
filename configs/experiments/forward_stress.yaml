name: forward_stress
notes: >
  Strict chronological stress test: train on the first 70%, validate on the
  next 15%, test on the final 15% of each recording, with purging. This exposes
  non-stationarity and late-recording behavioural degeneracy. It is a negative
  control for interpolation benchmarks, not the primary simulator fit.
data:
  dataset: kato2015
  path: data/raw/kato2015/WT_NoStim.mat
  exclude_behavior_neurons: true
split:
  mode: temporal
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  purge_frames: 12
model:
  latent_dim: 16
  hidden_dim: 128
  history: 1
train:
  epochs: 60
  batch_size: 256
  learning_rate: 0.001
  patience: 15
  seed: 17
evaluation:
  horizons: [1, 3, 5, 10]
  seeds: [17, 23, 31]
  bootstrap_samples: 400
  transition_horizon: 20
output_dir: artifacts/runs/forward_stress
