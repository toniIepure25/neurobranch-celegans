name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/release-venv/bin/neurobranch version
          /tmp/release-venv/bin/python -c "from importlib.resources import files; assert files('neurobranch.schemas').joinpath('claims.schema.json').is_file()"
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
