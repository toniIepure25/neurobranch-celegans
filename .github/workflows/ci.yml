name: CI

on:
  push:
    branches: [main, "research/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check (scoped)
        if: matrix.python-version == '3.13'
        run: mypy src/neurobranch/benchmark src/neurobranch/design src/neurobranch/uncertainty.py

      - name: Test with coverage
        if: matrix.python-version == '3.13'
        run: >
          pytest -q
          --cov=neurobranch.benchmark
          --cov=neurobranch.design
          --cov=neurobranch.uncertainty
          --cov-report=term-missing
          --cov-fail-under=60

      - name: Test without coverage
        if: matrix.python-version != '3.13'
        run: pytest -q

      - name: Validate Phase 10 reports
        if: matrix.python-version == '3.13'
        run: python scripts/validate_reports.py --strict

      - name: Validate Phase 12 reports
        if: matrix.python-version == '3.13'
        run: python scripts/validate_reports.py --reports reports/phase12 --strict

      - name: Validate Phase 12R reports
        if: matrix.python-version == '3.13'
        run: python scripts/validate_reports.py --reports reports/phase12r

      - name: Phase 12R report contracts
        if: matrix.python-version == '3.13'
        run: python -m pytest tests/test_phase12r_reports.py -q

      - name: Reproducibility hashes (Phase 12R)
        if: matrix.python-version == '3.13'
        run: python scripts/check_reproducibility.py --reports reports/phase12r --allow-missing-input

      - name: Validate historical Phase 9 reports
        if: matrix.python-version == '3.13'
        run: python scripts/validate_reports.py --reports reports/phase9 --strict

      - name: Audit claims against artifacts
        if: matrix.python-version == '3.13'
        run: python scripts/audit_claims.py

      - name: Check packaged schemas are in sync
        if: matrix.python-version == '3.13'
        run: python scripts/sync_schemas.py --check

      - name: Reproducibility hashes (Phase 10)
        if: matrix.python-version == '3.13'
        run: python scripts/check_reproducibility.py --allow-missing-input

      - name: Reproducibility hashes (Phase 11)
        if: matrix.python-version == '3.13'
        run: python scripts/check_reproducibility.py --reports reports/phase11 --allow-missing-input

      - name: Reproducibility hashes (Phase 12)
        if: matrix.python-version == '3.13'
        run: python scripts/check_reproducibility.py --reports reports/phase12 --allow-missing-input

      - name: Phase 12 report contracts
        if: matrix.python-version == '3.13'
        run: python -m pytest tests/test_phase12_reports.py -q

      - name: App smoke test
        if: matrix.python-version == '3.13'
        run: python -m pytest tests/app -q

      - name: Build documentation
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Check package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Install wheel outside the checkout
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/neurobranch version
          /tmp/wheel-venv/bin/python -c "from importlib.resources import files; assert files('neurobranch.schemas').joinpath('claims.schema.json').is_file()"
