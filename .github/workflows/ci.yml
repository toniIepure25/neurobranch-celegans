name: CI

on:
  push:
    branches: [main, "research/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check (scoped)
        if: matrix.python-version == '3.13'
        run: mypy src/neurobranch/benchmark src/neurobranch/design

      - name: Test
        run: pytest -q

      - name: Validate Phase 10 reports
        if: matrix.python-version == '3.13'
        run: python scripts/validate_reports.py --strict

      - name: Validate historical Phase 9 reports
        if: matrix.python-version == '3.13'
        run: python scripts/validate_reports.py --reports reports/phase9 --strict

      - name: Reproducibility hashes
        if: matrix.python-version == '3.13'
        run: python scripts/check_reproducibility.py --allow-missing-input
