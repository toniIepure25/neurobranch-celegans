site_name: NeuroBranch
site_description: Measurement-bounded C. elegans neural-response research platform
repo_url: https://github.com/neurobranch/neurobranch
docs_dir: docs
site_dir: .pytest_tmp/site
strict: true

validation:
  nav:
    omitted_files: ignore

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google

nav:
  - Home: README.md
  - Current status: CURRENT_STATUS.md
  - Core dynamics simulator:
      - Objective (provisional): ORIGINAL_RESEARCH_OBJECTIVE.md
      - Gap analysis: SIMULATOR_GAP_ANALYSIS.md
      - Protocol: SIMULATOR_RESEARCH_PROTOCOL.md
      - Dynamics model: NEURAL_DYNAMICS_MODEL.md
      - Latent validation: LATENT_SIMULATION_VALIDATION.md
      - Branching: BRANCHING_SIMULATION.md
      - Perturbation methods: NEURONAL_PERTURBATION_METHODS.md
      - Results: SIMULATOR_RESULTS.md
      - Limitations: SIMULATOR_LIMITATIONS.md
      - Supervisor brief: SIMULATOR_SUPERVISOR_BRIEF.md
      - Phase 6 results: SIMULATOR_PHASE6_RESULTS.md
      - Phase 6 supervisor brief: PHASE6_SIMULATOR_SUPERVISOR_BRIEF.md
