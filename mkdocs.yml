site_name: NeuroBranch
site_description: Measurement-bounded C. elegans neural-response research platform
repo_url: https://github.com/neurobranch/neurobranch
docs_dir: docs
site_dir: .pytest_tmp/site
strict: true

validation:
  nav:
    omitted_files: ignore
  links:
    # Legacy research pages intentionally link to repository artifacts outside
    # docs/ (reports/, src/, scripts/). MkDocs cannot validate those as site
    # files; the Studio docs are link-checked separately by tests.
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google

