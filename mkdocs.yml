site_name: NeuroBranch
site_description: Measurement-bounded C. elegans neural-response research platform
repo_url: https://github.com/neurobranch/neurobranch
docs_dir: docs
site_dir: .pytest_tmp/site
strict: true

validation:
  nav:
    omitted_files: ignore

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google

nav:
  - Home: README.md
  - Current status: CURRENT_STATUS.md
  - Phase 15:
      - Results: PHASE15_RESULTS.md
      - Methods: METHODS_PHASE15.md
      - Protocol: phase15_protocol.md
      - Deviations: phase15_deviations.md
  - Phase 14:
      - Results: PHASE14_RESULTS.md
      - Methods: METHODS_PHASE14.md
      - Reference audit: REFERENCE_AUDIT.md
      - Literature scan: LITERATURE_PHASE14.md
      - Manuscript draft: PAPER_DRAFT.md
  - Phase 13:
      - Results: PHASE13_RESULTS.md
      - Methods: METHODS_PHASE13.md
  - Phase 12R:
      - Results: PHASE12R_RESULTS.md
      - Hierarchical methods: METHODS_HIERARCHICAL.md
  - Phase 12:
      - Results: PHASE12_RESULTS.md
      - Analysis plan: PHASE12_ANALYSIS_PLAN.md
  - Phase 11:
      - Results: PHASE11_RESULTS.md
      - Analysis plan: PHASE11_ANALYSIS_PLAN.md
      - Deviations: PHASE11_DEVIATIONS.md
  - Phase 10:
      - Results: PHASE10_RESULTS.md
      - Research synthesis: PHASE10_RESEARCH_SYNTHESIS.md
  - Measurement:
      - Limits: MEASUREMENT_LIMITS.md
      - Design engine: DESIGN_ENGINE.md
      - Benchmark card: BENCHMARK_CARD.md
  - Claims:
      - Ledger: CLAIMS.md
      - Corrections: CORRECTIONS.md
      - Limitations: LIMITATIONS.md
  - Reproduce:
      - Guide: REPRODUCING.md
      - Data provenance: DATA_PROVENANCE.md
      - Licence audit: LICENSE_AUDIT.md
  - API reference: api.md
