name: forward_stress
data:
  dataset: kato2015
  path: data/raw/kato2015/WT_NoStim.mat
  exclude_behavior_neurons: true
  min_identified_neurons: 5
  macrostates: true
  smoothing_sigma_frames: 0.0
  detrend_window_frames: 0
  detrend_warmup_frames: 0
split:
  mode: temporal
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
  purge_frames: 12
  n_blocks: 5
  test_block: 2
  val_block: 4
  holdout_worm: 4
  seed: 17
model:
  name: latent_mlp
  latent_dim: 16
  hidden_dim: 128
  history: 12
  dropout: 0.0
  behavior_weight: 0.2
  n_behaviors: 4
  gamma: 0.9
  window: 15
train:
  epochs: 60
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 15
  grad_clip: 1.0
  seed: 17
  device: auto
  num_threads: 4
  noise_std: 0.0
evaluation:
  horizons:
  - 1
  - 3
  - 5
  - 10
  seeds:
  - 17
  - 23
  - 31
  bootstrap_samples: 400
  transition_horizon: 20
  branching_k: 40
  min_neighbors: 15
output_dir: artifacts/runs/forward_stress
notes: 'Strict chronological stress test: train on the first 70%, validate on the
  next 15%, test on the final 15% of each recording, with purging. This exposes non-stationarity
  and late-recording behavioural degeneracy. It is a negative control for interpolation
  benchmarks, not the primary simulator fit.

  '
